services:
  - type: web
    name: studypilot-lfish1230-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: qwen
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://studypilot-lfish1230-web.onrender.com
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: CHAT_MODEL
        value: qwen-plus
      - key: EMBEDDING_MODEL
        value: text-embedding-v4
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: SUPABASE_URL
        value: https://dvqdwnqwhzrhgejzrtus.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: course-pdfs

  - type: web
    name: studypilot-lfish1230-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://studypilot-lfish1230-api.onrender.com
